<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">
    
    <div class="container mt-5">
    <div class="row justify-content-center align-items-center min-vh-100">

    <div class="col-md-5 col-lg-4">
    <div class="card shadow">

        <div class="card-body p-4">
            <h2 class="text-center mb-4">
                Iniciar Sesion
            </h2>
            <form id="loginForm"> 
                <!--Usuario-->
                <div class="mb-3">
                    <label for="Usuario" class="form-label">
                        Usuario
                    </label>

                    <input type="text" class="form-control" id="usuario"
                    placeholder="Ingrese su usuario" required> 
                </div>

                <!--Contraseña-->
                <div class="mb-3">
                    <label for="password" class="form-label">
                        Contraseña
                    </label>

                    <input type="password" class="form-control" id="password" placeholder="Ingrese su Contraseña" required>

                </div>


            
        
            <!--Boton inicio-->
            <div class="d-grid">

            
            <button type="submit" class="btn btn-primary">
                Iniciar Sesión
            </button>
            </div>

        </form>

            <div id="mensaje" class="mt-3"></div>
        </div>
        </div>
    </div>
    </div>

    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        document.getElementById("loginForm").addEventListener("submit", async function name(event) {

            event.preventDefault();

            const usuario = document.getElementById("usuario").value;
            const password = document.getElementById("password").value;
            const mensaje = document.getElementById("mensaje");

            
            try{
                const respues = await fetch("/Index", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    usuario: usuario,
                    password: password
                })
            });

            const datos = await respues.json();

            console.log(datos);

            if(datos.success){
                    mensaje.innerHTML = `<div class="alert alert-success">
                    ${datos.mensaje} </div>`;

                    window.location.href = "Index.html";
            }else {
                mensaje.innerHTML = `<div class="alert-danger"> ${datos.mensaje} </div>`;
            }
        }catch (error){
            console.error("Error", error);

            mensaje.innerHTML `<div class="alert alert-danger">
                No se pudo conectar con el servidor
                </div>`;
        }
        });

    </script>
</body>
</html>
