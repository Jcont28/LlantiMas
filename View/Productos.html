<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Productos</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

</head>
<body>

    <div class="container mt-5">

        <h2>Registrar Productos</h2>

        <div class="card p-4">

            <div class="mb-3">

                <label class="form-label">Nombre</label>
                <input type="text" id="txtNombre" class="form-control">
            </div>

            <div class="mb-3">
                <label class="form-label">Precio</label>
                <input type="text" id="txtPrecio" class="form-control">
            </div>

            <div class="mb-3">
                <label class="form-label">Numeración</label>
                <input type="text" id="txtNumeracion" class="form-control">
            </div>

            <div class="mb-3">
                <label class="form-label">Stock</label>
                <input type="text" id="txtStock" class="form-control">
            </div>

            <div class="mb-3">
                <label class="form-label">Categoría</label>
                <input type="text" id="txtCategoria" class="form-control">
            </div>

            <div class="mb-3">
                <label class="form-label">Estado</label>
                <input type="text" id="txtEstado" class="form-control">
            </div>


            <button class="btn btn-primary" onclick="crearProducto()">
                Guardar Producto
            </button>
        </div>


    <div class="container mt-5">
        <H2>Listado de Productos</H2>
        <table class="table table-striped table-bordered">

            <thead class="table-primary">

                <tr>

                    <th>Id</th>
                    <th>Nombre</th>
                    <th>Precio</th>
                    <th>Numeración</th>
                    <th>Stock</th>
                    <th>Categoría</th>
                    <th>Estado</th>
                </tr>
            </thead>

            <tbody id="tablaProducto">


            </tbody>



        </table>
        <div class="modal fade" id="modaleditProducto" tabindex="-1" aria-hidden="true">

            <div class="modal-dialog">

                <div class="modal-content">
                    <div class="modal-header">
                        <h5 class="modal-title">
                            Editar Producto
                        </h5>

                        <button type="button" class="btn-close" data-bs-dismiss="modal">

                        </button>
                    </div>

                    <div class="modal-body">
                        <input type="hidden" id="editProductoID">

                        <div class="mb-3">

                            <label class="form-label">
                                Nombre
                            </label>

                            <input type="text" id="editNombre" class="form-control">
                        </div>

                        <div class="mb-3">
                            <label class="form-label">
                                Precio
                            </label>
                            <input type="text" id="editPrecio" class="form-control">
                        </div>

                        <div class="mb-3">
                            <label class="form-label">
                                Numeración 
                            </label>
                            <input type="text" id="editNumeracion" class="form-control">
                        </div>

                        <div class="mb-3">
                            <label class="form-label">
                                Stock 
                            </label>
                            <input type="text" id="editStock" class="form-control">
                        </div>

                        <div class="mb-3">
                            <label class="form-label">
                                Categoría 
                            </label>
                            <input type="text" id="editCategoria" class="form-control">
                        </div>

                        <div class="mb-3">
                            <label class="form-label">
                                Estado 
                            </label>
                            <input type="text" id="editEstado" class="form-control">
                        </div>
                    </div>

                    <div class="modal-footer">

                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">
                            Cancelar 
                        </button>

                        <button type="button" class="btn btn-primary" onclick="actualizarProducto()">
                            Guardar Cambios
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

    </div>

    <script>

            async function cargarProducto() {

                try{

                    const respuesta = await fetch("/producto");

                    const Producto = await respuesta.json();

                    const tabla = document.getElementById("tablaProducto");

                    tabla.innerHTML = "";

                    Producto.forEach(producto => {
                        
                        tabla.innerHTML += `

                        <tr>
                            <td>${producto.ProductoID}</td>
                            <td>${producto.Nombre}</td>
                            <td>${producto.Precio}</td>
                            <td>${producto.Numeracion}</td>
                            <td>${producto.Stock}</td>
                            <td>${producto.Categoria}</td>
                            <td>${producto.Estado}</td>


                            <td> 
                                <button class="btn btn-warning btn-sm" 
                                onclick = "editarProducto(${producto.ProductoID})">
                                Editar
                                </button>

                                <button class="btn btn-danger btn-sm" 
                                onclick="DesactivarProducto(${producto.ProductoID})">
                                Desactivar
                                </button>
                            </td>
                        </tr>
                        `;
                    });

                }catch (error){
                    console.log("Error al cargar Productos", error);
                }
                
            }


            async function DesactivarProducto(id) {
                if (!confirm("¿Deseas desactivar este producto")){
                    return;
                }
                
                try{
                    const respuesta = await fetch(`/producto/${id}`,{
                        method: "PATCH"
                    });

                    const resultado = await respuesta.json();

                    if(resultado.success)
                    {
                        alert(resultado.mensaje);
                        cargarProducto();
                    }else{

                        alert(resultado.mensaje);
                    }
                    
                }catch (error){
                    console.log("Error al desactivar producto");
                }
            }




            cargarProducto();


            async function editarProducto(id) {

             const fila = [...document.querySelectorAll("#tablaProducto tr")].find
             (tr => tr.children[0].textContent == id);

                if(!fila){
                    alert("No se encontro el producto");
                    return;
                }
                
                const nombre = fila.children[1].textContent;
                const precio = fila.children[2].textContent;
                const numeracion = fila.children[3].textContent;
                const stock = fila.children[4].textContent;
                const categoria = fila.children[5].textContent;
                const estado = fila.children[6].textContent;

                document.getElementById("editProductoID").value = id;
                document.getElementById("editNombre").value = nombre;
                document.getElementById("editPrecio").value = precio;
                document.getElementById("editNumeracion").value = numeracion;
                document.getElementById("editStock").value = stock;
                document.getElementById("editCategoria").value = categoria;
                document.getElementById("editEstado").value = estado;

                const modal = new bootstrap.Modal(
                    document.getElementById("modaleditProducto")
                );

                modal.show();
         }


         async function actualizarProducto() {
            
            const id = document.getElementById("editProductoID").value;
            const nombre = document.getElementById("editNombre").value;
            const precio = document.getElementById("editPrecio").value;
            const numeracion = document.getElementById("editNumeracion").value;
            const stock = document.getElementById("editStock").value;
            const categoria = document.getElementById("editCategoria").value;
            const estado = document.getElementById("editEstado").value;

            if(!nombre || !precio || !numeracion || !stock || !categoria || !estado){
                alert("Los campos son obligatorio");
                return;
            }

            try{
                const respuesta = await fetch(`/producto/${id}`,{
                    method: "PUT",
                    headers: {
                        "Content-Type": "application/json"
                    }, 

                    body: JSON.stringify({
                        Nombre: nombre,
                        Precio: precio,
                        Numeracion: numeracion,
                        Stock: stock,
                        Categoria: categoria,
                        Estado: estado 
                    })
                });

                const resultado = await respuesta.json();

                if(resultado.success){
                    alert(resultado.mensaje);

                    cargarProducto();

                    const modalelement = document.getElementById("modaleditProducto");

                    const modal = bootstrap.Modal.getInstance(modalelement);

                    modal.hide();
                }else{
                    alert(resultado.mensaje);
                }
            }catch(error){
                console.log("Error al actualizar producto: ", error);
            }
         }

          async function crearProducto() {
            
            const nombre = document.getElementById("txtNombre").value;
            const precio = document.getElementById("txtPrecio").value;
            const numeracion = document.getElementById("txtNumeracion").value;
            const stock = document.getElementById("txtStock").value;
            const categoria = document.getElementById("txtCategoria").value;
            const estado = document.getElementById("txtEstado").value;

            if(!nombre || !precio || !numeracion || !stock || !categoria || !estado){
                alert("Todos los campos son obligatorios");
                return;
            }

            try{
                const respuesta = await fetch("/producto", {
                    method: "POST",
                    
                    headers: {
                        "content-Type": "application/json"
                    },

                    body: JSON.stringify({
                        Nombre: nombre,
                        Precio: precio,
                        NumeracionID: numeracion,
                        Stock: stock,
                        CategoriaID: categoria,
                        Estado: estado
                    })
                });

                const resultado = await respuesta.json();

                if(resultado.success){
                    alert(resultado.mensaje);

                    document.getElementById("txtnombre").value = "";
                    document.getElementById("txtprecio").value = "";
                    document.getElementById("txtnumeracion").value = "";
                    document.getElementById("txtstock").value = "";
                    document.getElementById("txtcategoria").value = "";
                    document.getElementById("txtestado").value = "";

                    cargarProducto();
                }else{
                    alert(resultado.mensaje);
                }
            }catch(error){
                console.log("Error al crear el producto", error);
            }
        }

    </script>

    
</body>
</html>
