<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inicio - Mi Sistema</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <nav class="navbar navbar-dark bg-primary shadow">
        <div class="container">

            <a class="navbar-brand fw-bold" href="#">

                Mi inventario
            </a>


            <!--Menú-->
            <div class="d-flex gap-2">

                <a class="btn btn-light btn-sm" href="#">
                    Inicio
                </a>
                <a class="btn btn-primary btn-sm" href="#">
                    Productos
                </a>
                <a class="btn btn-primary btn-sm" href="#">
                    Clientes
                </a>
                <a class="btn btn-primary btn-sm" href="HistorialVent.html">
                    Historial Ventas
                </a>
            </div>
        </div>
    </nav>
    
    <main class="container mt-5">


        <div class="text-center mb-5">
            <h1 class="fw-bold">
                Panel de Control 
            </h1>

            <p class="text-muted">
                Bienvenido 
            </p>
        </div>

        <div class="row g-4">

            <div class="col-md-4">
            <div class="card shadow-sm border-0 h-100">

                <div class="card-body text-center">

                    <div class="fs-1 mb-3">
                        📦
                    </div>

                    <h5 class="card-title fw-bold">
                        Productos
                    </h5>

                    <p class="card-text text-muted">
                        <span id="totalProductos">0</span>
                        productos registrados.
                    </p>

                    <a href="Productos.html" class="btn btn-primary">
                        Ver productos
                    </a>
                </div>
            </div>
        </div>


        <div class="col-md-4">

            <div class="card shadow-sm border-0 h-100">

                <div class="card-body text-center">

                    <div class="fs-1 mb-3">
                        👥
                    </div>

                    <h5 class="card-title fw-bold">
                        Clientes
                    </h5>

                    <p class="card-text text-muted">
                        <span id="totalClientes">0</span>
                        Clientes registrados
                    </p>

                    <a href="Client.html" class="btn btn-primary">
                        Ver clientes
                    </a>
                </div>
            </div>
        </div>


        <div class="col-md-4">

            <div class="card shadow-sm border-0 h-100">

                <div class="card-body text-center">

                    <div class="fs-1 mb-3">

                        💰

                    </div>

                <h5 class="card-title fw-bold">
                    Ventas
                </h5>

                <p class="card-text text-muted">
                    <span id="totalVentas">0</span>
                    ventas realizadas.
                </p>

                <a href="Ventas.html" class="btn btn-primary">
                    Ver ventas
                </a>
            </div>
        </div>
    </div>
</div>


</main>

<script>

    async function cargarDashboard() {
        
        try{
            const respuesta = await fetch("/dashboard");

            const datos = await respuesta.json();

            console.log(datos);

            document.getElementById("totalProductos").textContent = datos.productos;
            document.getElementById("totalClientes").textContent = datos.clientes;
            document.getElementById("totalVentas").textContent = datos.ventas;
        }catch(error){
            console.error("Error al cargar Dashboard", error);
        }
    }

    cargarDashboard();
    setInterval(cargarDashboard, 10000);
</script>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.min.js"></script>
    
</body>
</html>
