<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clientes</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

</head>
<body>

    <div class="container mt-5">

        <h2>Registrar Clientes</h2>

        <div class="card p-4">

            <div class="mb-3">

                <label class="form-label">Nombre</label>
                <input type="text" id="txtNombre" class="form-control">
            </div>

            <div class="mb-3">
                <label class="form-label">Telefono</label>
                <input type="text" id="txtTelefono" class="form-control">
            </div>

            <div class="mb-3">
                <label class="form-label">Dirección</label>
                <input type="text" id="txtDireccion" class="form-control">
            </div>

            <button class="btn btn-primary" onclick="crearCliente()">
                Guardar Cliente
            </button>
        </div>


    <div class="container mt-5">
        <H2>Listado de Clientes</H2>
        <table class="table table-striped table-bordered">

            <thead class="table-primary">

                <tr>

                    <th>Id</th>
                    <th>Nombre</th>
                    <th>Telefono</th>
                    <th>Direccio</th>
                    <th>Acciones</th>
                </tr>
            </thead>

            <tbody id="tablaClientes">


            </tbody>



        </table>
        <div class="modal fade" id="modaleditCliente" tabindex="-1" aria-hidden="true">

            <div class="modal-dialog">

                <div class="modal-content">
                    <div class="modal-header">
                        <h5 class="modal-title">
                            Editar Cliente
                        </h5>

                        <button type="button" class="btn-close" data-bs-dismiss="modal">

                        </button>
                    </div>

                    <div class="modal-body">
                        <input type="hidden" id="editClienteID">

                        <div class="mb-3">

                            <label class="form-label">
                                Nombre
                            </label>

                            <input type="text" id="editNombre" class="form-control">
                        </div>

                        <div class="mb-3">
                            <label class="form-label">
                                Telefono
                            </label>
                            <input type="text" id="editTelefono" class="form-control">
                        </div>

                        <div class="mb-3">
                            <label class="form-label">
                                Dirección 
                            </label>
                            <input type="text" id="editDireccion" class="form-control">
                        </div>
                    </div>

                    <div class="modal-footer">

                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">
                            Cancelar 
                        </button>

                        <button type="button" class="btn btn-primary" onclick="actualizarCliente()">
                            Guardar Cambios
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

    </div>

    <script>

            async function cargarClientes() {

                try{

                    const respuesta = await fetch("/Cliente");

                    const clientes = await respuesta.json();

                    const tabla = document.getElementById("tablaClientes");

                    tabla.innerHTML = "";

                    clientes.forEach(cliente => {
                        
                        tabla.innerHTML += `

                        <tr>
                            <td>${cliente.ClienteID}</td>
                            <td>${cliente.Nombre}</td>
                            <td>${cliente.Telefono}</td>
                            <td>${cliente.Direccion}</td>


                            <td> 
                                <button class="btn btn-warning btn-sm" 
                                onclick = "editarCliente(${cliente.ClienteID})">
                                Editar
                                </button>

                                <button class="btn btn-danger btn-sm" 
                                onclick="Desactivarcliente(${cliente.ClienteID})">
                                Desactivar
                                </button>
                            </td>
                        </tr>
                        `;
                    });

                }catch (error){
                    console.log("Error al cargar Clientes", error);
                }
                
            }


            async function Desactivarcliente(id) {
                if (!confirm("¿Deseas desactivar este cliente")){
                    return;
                }
                
                try{
                    const respuesta = await fetch(`/Cliente/${id}`,{
                        method: "PATCH"
                    });

                    const resultado = await respuesta.json();

                    if(resultado.success)
                    {
                        alert(resultado.mensaje);
                        cargarClientes();
                    }else{

                        alert(resultado.mensaje);
                    }
                    
                }catch (error){
                    console.log("Error al desactivar cliente");
                }
            }




            cargarClientes();


            async function editarCliente(id) {

             const fila = [...document.querySelectorAll("#tablaClientes tr")].find
             (tr => tr.children[0].textContent == id);

                if(!fila){
                    alert("No se encontro el cliente");
                    return;
                }
                
                const nombre = fila.children[1].textContent;
                const telefono = fila.children[2].textContent;
                const direccion = fila.children[3].textContent;

                document.getElementById("editClienteID").value = id;
                document.getElementById("editNombre").value = nombre;
                document.getElementById("editTelefono").value = telefono;
                document.getElementById("editDireccion").value = direccion;

                const modal = new bootstrap.Modal(
                    document.getElementById("modaleditCliente")
                );

                modal.show();
         }


         async function actualizarCliente() {
            
            const id = document.getElementById("editClienteID").value;
            const nombre = document.getElementById("editNombre").value;
            const telefono = document.getElementById("editTelefono").value;
            const direccion = document.getElementById("editDireccion").value;

            if(!nombre || !telefono || !direccion){
                alert("Los campos son obligatorio");
                return;
            }

            try{
                const respuesta = await fetch(`/Cliente/${id}`,{
                    method: "PUT",
                    headers: {
                        "Content-Type": "application/json"
                    }, 

                    body: JSON.stringify({
                        Nombre: nombre,
                        Telefono: telefono,
                        Direccion: direccion 
                    })
                });

                const resultado = await respuesta.json();

                if(resultado.success){
                    alert(resultado.mensaje);

                    cargarClientes();

                    const modalelement = document.getElementById("modaleditCliente");

                    const modal = bootstrap.Modal.getInstance(modalelement);

                    modal.hide();
                }else{
                    alert(resultado.mensaje);
                }
            }catch(error){
                console.log("Error al actualizar cliente: ", error);
            }
         }

          async function crearCliente() {
            
            const nombre = document.getElementById("txtNombre").value;
            const telefono = document.getElementById("txtTelefono").value;
            const direccion = document.getElementById("txtDireccion").value;

            if(!nombre || !telefono || !direccion){
                alert("Todos los campos son obligatorios");
                return;
            }

            try{
                const respuesta = await fetch("/Cliente", {
                    method: "POST",
                    
                    headers: {
                        "content-Type": "application/json"
                    },

                    body: JSON.stringify({
                        Nombre: nombre,
                        Telefono: telefono,
                        Direccion: direccion
                    })
                });

                const resultado = await respuesta.json();

                if(resultado.success){
                    alert(resultado.mensaje);

                    document.getElementById("txtNombre").value = "";
                    document.getElementById("txtTelefono").value = "";
                    document.getElementById("txtDireccion").value = "";

                    cargarClientes();
                }else{
                    alert(resultado.mensaje);
                }
            }catch(error){
                console.log("Error al crear cliente", error);
            }
        }

    </script>

    
</body>
</html>
